name: Build and Sign

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Black Browser (x64)
        shell: cmd
        run: ci-build.bat

      - name: Run Security Regression Tests
        shell: pwsh
        run: .\tests\run-security-tests.ps1

      - name: Upload unsigned build artifact
        id: upload_unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackBrowser-unsigned
          path: Black.exe

  sign:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check SignPath Secrets Availability
        id: signpath_check
        shell: pwsh
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          PROJ_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          POL_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $has = (-not [string]::IsNullOrWhiteSpace($env:API_TOKEN)) -and (-not [string]::IsNullOrWhiteSpace($env:ORG_ID)) -and (-not [string]::IsNullOrWhiteSpace($env:PROJ_SLUG)) -and (-not [string]::IsNullOrWhiteSpace($env:POL_SLUG))
          "enabled=$($has.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign with SignPath.io
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-and-test.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed

      - name: Upload signed binary
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackBrowser-signed
          path: ./signed/*.exe
